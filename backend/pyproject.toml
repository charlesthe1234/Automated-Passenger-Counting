[project]
name = "cag-backend"
version = "1.5.0"
description = "FastAPI service for the CAG passenger monitoring dashboard: MQTT ingestion, evacuee evidence, run lifecycle, and shift reporting."
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "opencv-python>=4.11.0.86",
    "sqlalchemy>=2.0.51",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "numpy>=2.4.4",
    "python-multipart>=0.0.32",
    "paho-mqtt>=2.1.0",
    "openpyxl>=3.1.5",
    "alembic>=1.18.5",
    "argon2-cffi>=25.1.0",
]

[dependency-groups]
# Starlette's TestClient requires httpx; it is not needed to serve the app.
dev = [
    "httpx>=0.28.1",
]

[tool.uv]
# backend/ is a collection of top-level modules (main.py, config.py, crud.py) plus
# subpackages, run in place by uvicorn rather than installed. Nothing to build.
package = false

# Pin the set that backend/.venv-linux was verified running on, so adopting uv
# reproduces the working environment instead of silently pulling newer releases.
# Transitive entries are here because a bare resolve upgrades them too.
# To take upgrades deliberately: drop an entry, re-lock, and run the test suite.
constraint-dependencies = [
    "fastapi==0.139.2",
    "uvicorn==0.51.0",
    "alembic==1.18.5",
    "annotated-doc==0.0.4",
    "cffi==2.1.0",
    "mako==1.3.12",
    "websockets==16.1.1",
]
