# Project-owned BoT-SORT settings tuned to reduce short-lived duplicate tracks.
# The cameras are fixed, so global motion compensation is disabled to avoid
# running sparse optical flow over every high-resolution frame. The thresholds,
# BoT-SORT appearance association remains active, and application-level shadow
# suppression remains available when Appearance ReID is enabled. Keep this file
# under version control so an Ultralytics package update cannot silently change
# the tracker behaviour.

tracker_type: botsort
track_high_thresh: 0.50
track_low_thresh: 0.10
new_track_thresh: 0.70
track_buffer: 30
match_thresh: 0.80
fuse_score: true
gmc_method: none
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: true
model: auto
