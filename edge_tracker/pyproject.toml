# MiVOLO's setup.py imports pkg_resources without declaring setuptools as a
# build requirement. Modern setuptools no longer ships pkg_resources at all,
# so the build environment is pinned to the last series that provides it.
[tool.uv.extra-build-dependencies]
mivolo = ["setuptools<81"]
