[project]
name = "cag-edge-tracker"
version = "1.5.0"
description = "GPU computer-vision worker for CAG: YOLO detection, MediaPipe pose, TransReID appearance re-identification, role classification, and MiVOLO demographics."
requires-python = ">=3.13"

dependencies = [
    # Detection, tracking, and pose
    "ultralytics>=8.4.104",
    "mediapipe>=0.10.35",
    "opencv-python>=4.11.0.86",
    "numpy>=2.4.4",
    "pillow>=12.2.0",
    "scipy>=1.18.0",
    # Appearance ReID (TransReID ViT backbone) and demographics
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "timm==0.8.13.dev0",
    "transformers>=4.51.0",
    "huggingface-hub>=0.36.2",
    "mivolo",
    # Required by the vendored fast-reid checkout that supplies the ViT backbone
    "yacs>=0.1.8",
    "termcolor>=3.3.0",
    "tabulate>=0.10.0",
    "pyyaml>=6.0",
    # Telemetry to the FastAPI backend
    "paho-mqtt>=2.1.0",
]

# The tracker resolves torch against NVIDIA's CUDA 12.8 wheel index. The stock
# PyPI build is CPU-only, which silently drops the worker to unusable speeds,
# so this index is declared explicitly rather than left as a manual step.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
# MiVOLO has no PyPI release; it is pinned to the commit this system was built
# against. It is what pins timm to the 0.8.13.dev0 pre-release above.
mivolo = { git = "https://github.com/WildChlamydia/MiVOLO.git", rev = "37475e3f8818b5f22448003feec3e64b01bfb188" }

[tool.uv]
# edge_tracker/ is run in place (launcher_ui.py, cv_worker.py), not installed.
package = false
# timm 0.8.13.dev0 is a pre-release and MiVOLO requires exactly it.
prerelease = "allow"

# MiVOLO pins ultralytics==8.1.0, but this system has always run 8.4.104 and
# depends on its tracker behaviour. `pip check` reports the same conflict against
# the existing .venv-cv-linux, so this override records the environment as it is
# rather than downgrading a working detector to satisfy a stale upstream pin.
override-dependencies = [
    "ultralytics>=8.4.104",
]

# Generated from the verified-working .venv-cv-linux (uv pip list --format=freeze).
# The CV stack is a GPU appliance: an unconstrained resolve pulls mediapipe 1.0,
# transformers 5.x, OpenCV 5.0 and huggingface-hub 1.x, which are major-version
# jumps this tracker has never run. These pins reproduce the environment that is
# known to work. Regenerate deliberately after validating an upgrade on hardware.
